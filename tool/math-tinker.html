<!DOCTYPE HTML>
<html>
<head>
  <script src="https://unpkg.com/mathjs/lib/browser/math.js"></script>
</head>
<body>
  <script type="text/javascript">
    document.write(math.evaluate('1+2324/52'))
    document.write(math.evaluate('1237051+589218095'))
    document.write(math.evaluate('1-1+1/3'))
    function equal_one(num){
        return num == 1
    }
    var expression = prompt("Type an expression you believe to be equal to one!")
    document.write(equal_one(math.evaluate(expression)))
  </script>
</body>
</html>
